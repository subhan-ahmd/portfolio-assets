name: Generate Asset Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'projects/**'
      - 'education/**'
      - 'experience/**'
      - 'certifications/**'
      - 'skills/**'
      - 'profile.*'
      - 'generate_manifest.py'
  workflow_run:
    workflows: ["Generate CV PDF"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: generate-manifest
  cancel-in-progress: true

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit back to the repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔀 Check if CV workflow will also run
        if: github.event_name == 'push'
        id: cv_check
        run: |
          # If this push also triggers the CV workflow, skip this run.
          # The CV workflow will chain into manifest via workflow_run,
          # ensuring the manifest includes the new CV filename.
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- data/ generate_cv.py requirements.txt 2>/dev/null || echo "")
          if [ -n "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ CV workflow will also run — deferring to workflow_run trigger"
          fi

      - name: 🐍 Set up Python
        if: steps.cv_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🔍 Generate manifest.json
        if: steps.cv_check.outputs.skip != 'true'
        run: python generate_manifest.py

      - name: 📊 Check for changes
        if: steps.cv_check.outputs.skip != 'true'
        id: verify_diff
        run: |
          git diff --quiet manifest.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 💾 Commit and push manifest
        if: steps.cv_check.outputs.skip != 'true' && steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git commit -m "🤖 Auto-update manifest.json [skip ci]"
          git pull --rebase -X theirs
          git push

      - name: ✅ Done
        if: steps.cv_check.outputs.skip != 'true'
        run: |
          if [ "${{ steps.verify_diff.outputs.changed }}" == "true" ]; then
            echo "✨ Manifest updated successfully!"
          else
            echo "📝 Manifest is already up to date"
          fi
